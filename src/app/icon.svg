<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!--
    Favicon: "dm" monogram matching the hero nav mark, on the Golden Hour
    sunset gradient (amber -> coral, same direction as the hero sky).
    Replaces the stock Next.js favicon, which was byte-identical to the
    framework default and showed Next's logo in the browser tab.

    The letterforms are drawn as paths rather than <text>: an SVG favicon is
    rasterised at 16px in a context with no guarantee about which fonts are
    available, and a missing font would silently fall back to a different
    face or render nothing at all. Paths always look the same.
  -->
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F5C542" />
      <stop offset="0.5" stop-color="#E8934A" />
      <stop offset="1" stop-color="#E4674F" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#sunset)" />

  <!-- "dm", cream (#F4EEE4), heavy geometric forms sized to survive 16px.
       Built from rects + arcs so the strokes stay thick and even. -->
  <g fill="#F4EEE4">
    <!-- d: bowl + ascender stem -->
    <path d="M25 14h6v36h-6v-3.2a10.6 10.6 0 0 1-6.7 2.4C12.1 49.2 8 44.4 8 37.6S12.1 26 18.3 26a10.6 10.6 0 0 1 6.7 2.4V14Zm-6.1 17.5c-3.3 0-5.6 2.6-5.6 6.1s2.3 6.1 5.6 6.1 5.7-2.6 5.7-6.1-2.4-6.1-5.7-6.1Z" />
    <!-- m: three stems, two shoulders -->
    <!-- translate/scale balances the optical side-bearings: the "d" stem
         starts at x=8, so the "m" is pulled left to leave comparable
         breathing room on the right instead of crowding the rounded corner. -->
    <path d="M36 26.8h5.7v2.7a7.4 7.4 0 0 1 5.6-2.5c2.4 0 4.3 1 5.4 2.9a7.9 7.9 0 0 1 6.1-2.9c4.3 0 7.2 3 7.2 7.7V50h-5.9V36.2c0-2.4-1.3-3.9-3.4-3.9s-3.6 1.6-3.6 4.1V50h-5.9V36.2c0-2.4-1.3-3.9-3.4-3.9s-3.5 1.6-3.5 4.1V50H36V26.8Z" transform="translate(-4 0) scale(0.94 1)" />
  </g>
</svg>
